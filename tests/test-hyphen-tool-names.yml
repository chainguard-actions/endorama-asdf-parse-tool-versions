name: Test hyphen tool names - hyphens replaced with underscores
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .tool-versions file with hyphenated tool names
        run: |
          cat > "$GITHUB_WORKSPACE/.tool-versions" <<'EOF'
          golangci-lint 1.54.0
          kubectl 1.28.0
          EOF

      - id: versions
        uses: .

      - name: Assert tools output is valid JSON
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          if [ -z "$TOOLS" ]; then
            echo "FAIL: tools output is empty"
            exit 1
          fi
          echo "$TOOLS" | python3 -c "import sys, json; json.load(sys.stdin)" || {
            echo "FAIL: tools output is not valid JSON"
            exit 1
          }
          echo "PASS: tools output is valid JSON"

      - name: Assert golangci_lint (hyphen replaced with underscore) in JSON output
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          # The action sanitizes 'golangci-lint' -> 'golangci_lint' in JSON keys
          LINT_VER=$(echo "$TOOLS" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('golangci_lint','NOT_FOUND'))")
          echo "golangci_lint version: $LINT_VER"
          if [ "$LINT_VER" != "1.54.0" ]; then
            echo "FAIL: expected golangci_lint version '1.54.0', got '$LINT_VER'"
            exit 1
          fi
          echo "PASS: golangci_lint key found with correct version"

      - name: Assert hyphenated key is NOT present in JSON output
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          # The original hyphenated name should not appear as a key
          HYPHEN_VER=$(echo "$TOOLS" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('golangci-lint','NOT_FOUND'))")
          echo "golangci-lint (hyphen) version: $HYPHEN_VER"
          if [ "$HYPHEN_VER" != "NOT_FOUND" ]; then
            echo "FAIL: hyphenated key 'golangci-lint' should not exist in JSON output"
            exit 1
          fi
          echo "PASS: hyphenated key correctly absent from JSON"

      - name: Assert GOLANGCI_LINT_VERSION env var is exported
        run: |
          echo "GOLANGCI_LINT_VERSION=$GOLANGCI_LINT_VERSION"
          if [ "$GOLANGCI_LINT_VERSION" != "1.54.0" ]; then
            echo "FAIL: expected GOLANGCI_LINT_VERSION='1.54.0', got '$GOLANGCI_LINT_VERSION'"
            exit 1
          fi
          echo "PASS"

      - name: Assert KUBECTL_VERSION env var is exported
        run: |
          echo "KUBECTL_VERSION=$KUBECTL_VERSION"
          if [ "$KUBECTL_VERSION" != "1.28.0" ]; then
            echo "FAIL: expected KUBECTL_VERSION='1.28.0', got '$KUBECTL_VERSION'"
            exit 1
          fi
          echo "PASS"
