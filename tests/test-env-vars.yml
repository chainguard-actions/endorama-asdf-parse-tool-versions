name: Test environment variable export
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action
        id: versions
        uses: .

      - name: Assert NODEJS_VERSION env var is exported
        run: |
          echo "NODEJS_VERSION: $NODEJS_VERSION"
          if [ -z "$NODEJS_VERSION" ]; then
            echo "FAIL: NODEJS_VERSION env var was not exported"
            exit 1
          fi
          echo "PASS: NODEJS_VERSION=$NODEJS_VERSION"

      - name: Assert NODEJS_VERSION matches tools output
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          EXPECTED=$(echo "$TOOLS" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('nodejs',''))")
          echo "expected nodejs version from JSON: $EXPECTED"
          echo "actual NODEJS_VERSION env var: $NODEJS_VERSION"
          if [ "$NODEJS_VERSION" != "$EXPECTED" ]; then
            echo "FAIL: NODEJS_VERSION='$NODEJS_VERSION' does not match tools output value '$EXPECTED'"
            exit 1
          fi
          echo "PASS: NODEJS_VERSION matches tools output"
