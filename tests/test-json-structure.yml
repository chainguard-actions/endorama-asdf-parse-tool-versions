name: Test JSON output structure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action
        id: versions
        uses: .

      - name: Assert tools output is a JSON object with string values
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          # Verify it is a JSON object (not array, not null)
          TYPE=$(echo "$TOOLS" | python3 -c "import sys, json; d=json.load(sys.stdin); print(type(d).__name__)")
          echo "JSON type: $TYPE"
          if [ "$TYPE" != "dict" ]; then
            echo "FAIL: expected JSON object (dict), got $TYPE"
            exit 1
          fi
          echo "PASS: tools output is a JSON object"

      - name: Assert all values in tools output are strings
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          INVALID=$(echo "$TOOLS" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          invalid = [(k, v) for k, v in d.items() if not isinstance(v, str)]
          if invalid:
              print('invalid: ' + str(invalid))
          else:
              print('ok')
          ")
          echo "validation result: $INVALID"
          if [ "$INVALID" != "ok" ]; then
            echo "FAIL: some values are not strings: $INVALID"
            exit 1
          fi
          echo "PASS: all values in tools output are strings"
