name: Test working_directory input - parse .tool-versions from subdirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .tool-versions file in a subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/myproject"
          cat > "$GITHUB_WORKSPACE/myproject/.tool-versions" << 'EOF'
          golang 1.21.0
          terraform 1.5.7
          EOF

      - id: action
        uses: .
        with:
          working_directory: ${{ github.workspace }}/myproject

      - name: Assert tools output is valid JSON
        env:
          ACTUAL: ${{ steps.action.outputs.tools }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: tools output is empty"
            exit 1
          fi
          echo "$ACTUAL" | python3 -c "import sys, json; json.load(sys.stdin)" || {
            echo "FAIL: tools output is not valid JSON"
            exit 1
          }
          echo "PASS: tools output is valid JSON"

      - name: Assert golang version in output
        env:
          ACTUAL: ${{ steps.action.outputs.tools }}
        run: |
          echo "actual: $ACTUAL"
          GOLANG_VERSION_OUT=$(echo "$ACTUAL" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('golang',''))")
          echo "golang version: $GOLANG_VERSION_OUT"
          if [ "$GOLANG_VERSION_OUT" != "1.21.0" ]; then
            echo "FAIL: expected golang version '1.21.0', got '$GOLANG_VERSION_OUT'"
            exit 1
          fi
          echo "PASS"

      - name: Assert terraform version in output
        env:
          ACTUAL: ${{ steps.action.outputs.tools }}
        run: |
          echo "actual: $ACTUAL"
          TERRAFORM_VERSION_OUT=$(echo "$ACTUAL" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('terraform',''))")
          echo "terraform version: $TERRAFORM_VERSION_OUT"
          if [ "$TERRAFORM_VERSION_OUT" != "1.5.7" ]; then
            echo "FAIL: expected terraform version '1.5.7', got '$TERRAFORM_VERSION_OUT'"
            exit 1
          fi
          echo "PASS"

      - name: Assert GOLANG_VERSION env var is set
        run: |
          echo "GOLANG_VERSION env: $GOLANG_VERSION"
          if [ "$GOLANG_VERSION" != "1.21.0" ]; then
            echo "FAIL: expected GOLANG_VERSION='1.21.0', got '$GOLANG_VERSION'"
            exit 1
          fi
          echo "PASS"

      - name: Assert TERRAFORM_VERSION env var is set
        run: |
          echo "TERRAFORM_VERSION env: $TERRAFORM_VERSION"
          if [ "$TERRAFORM_VERSION" != "1.5.7" ]; then
            echo "FAIL: expected TERRAFORM_VERSION='1.5.7', got '$TERRAFORM_VERSION'"
            exit 1
          fi
          echo "PASS"
