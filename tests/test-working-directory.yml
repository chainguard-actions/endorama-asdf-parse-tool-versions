name: Test working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a .tool-versions file in a subdirectory
        run: |
          mkdir -p /tmp/myproject
          echo "python 3.11.0" > /tmp/myproject/.tool-versions
          echo "terraform 1.5.0" >> /tmp/myproject/.tool-versions

      - id: versions
        uses: .
        with:
          working_directory: /tmp/myproject

      - name: Assert tools output contains python
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          if [ -z "$TOOLS" ]; then
            echo "FAIL: tools output is empty"
            exit 1
          fi
          PYTHON_VER=$(echo "$TOOLS" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('python',''))")
          echo "python version: $PYTHON_VER"
          if [ "$PYTHON_VER" != "3.11.0" ]; then
            echo "FAIL: expected python=3.11.0, got '$PYTHON_VER'"
            exit 1
          fi
          echo "PASS: python=$PYTHON_VER"

      - name: Assert tools output contains terraform
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          TERRAFORM_VER=$(echo "$TOOLS" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('terraform',''))")
          echo "terraform version: $TERRAFORM_VER"
          if [ "$TERRAFORM_VER" != "1.5.0" ]; then
            echo "FAIL: expected terraform=1.5.0, got '$TERRAFORM_VER'"
            exit 1
          fi
          echo "PASS: terraform=$TERRAFORM_VER"

      - name: Assert PYTHON_VERSION env var is exported
        run: |
          echo "PYTHON_VERSION=$PYTHON_VERSION"
          if [ "$PYTHON_VERSION" != "3.11.0" ]; then
            echo "FAIL: expected PYTHON_VERSION=3.11.0, got '$PYTHON_VERSION'"
            exit 1
          fi
          echo "PASS: PYTHON_VERSION=$PYTHON_VERSION"

      - name: Assert TERRAFORM_VERSION env var is exported
        run: |
          echo "TERRAFORM_VERSION=$TERRAFORM_VERSION"
          if [ "$TERRAFORM_VERSION" != "1.5.0" ]; then
            echo "FAIL: expected TERRAFORM_VERSION=1.5.0, got '$TERRAFORM_VERSION'"
            exit 1
          fi
          echo "PASS: TERRAFORM_VERSION=$TERRAFORM_VERSION"
