name: Test working_directory input - parse tool-versions from custom directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .tool-versions file in a subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/myproject"
          cat > "$GITHUB_WORKSPACE/myproject/.tool-versions" <<'EOF'
          python 3.11.5
          terraform 1.6.0
          EOF

      - id: action
        uses: .
        with:
          working_directory: ${{ github.workspace }}/myproject

      - name: Assert tools output contains python
        env:
          TOOLS: ${{ steps.action.outputs.tools }}
        run: |
          echo "tools: $TOOLS"
          if [ -z "$TOOLS" ]; then
            echo "FAIL: tools output is empty"
            exit 1
          fi
          PYTHON_VER=$(echo "$TOOLS" | python3 -c "import sys, json; d = json.load(sys.stdin); print(d.get('python', ''))")
          echo "python version: $PYTHON_VER"
          if [ "$PYTHON_VER" != "3.11.5" ]; then
            echo "FAIL: expected python version '3.11.5', got '$PYTHON_VER'"
            exit 1
          fi
          echo "PASS"

      - name: Assert tools output contains terraform
        env:
          TOOLS: ${{ steps.action.outputs.tools }}
        run: |
          echo "tools: $TOOLS"
          TERRAFORM_VER=$(echo "$TOOLS" | python3 -c "import sys, json; d = json.load(sys.stdin); print(d.get('terraform', ''))")
          echo "terraform version: $TERRAFORM_VER"
          if [ "$TERRAFORM_VER" != "1.6.0" ]; then
            echo "FAIL: expected terraform version '1.6.0', got '$TERRAFORM_VER'"
            exit 1
          fi
          echo "PASS"

      - name: Assert env vars are exported for custom directory tools
        run: |
          echo "PYTHON_VERSION=$PYTHON_VERSION"
          echo "TERRAFORM_VERSION=$TERRAFORM_VERSION"
          if [ "$PYTHON_VERSION" != "3.11.5" ]; then
            echo "FAIL: expected PYTHON_VERSION='3.11.5', got '$PYTHON_VERSION'"
            exit 1
          fi
          if [ "$TERRAFORM_VERSION" != "1.6.0" ]; then
            echo "FAIL: expected TERRAFORM_VERSION='1.6.0', got '$TERRAFORM_VERSION'"
            exit 1
          fi
          echo "PASS"
