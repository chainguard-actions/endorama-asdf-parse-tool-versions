name: Test working_directory input - parse .tool-versions from custom directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom .tool-versions file in a subdirectory
        run: |
          mkdir -p /tmp/myproject
          cat > /tmp/myproject/.tool-versions <<'EOF'
          golang 1.21.0
          ruby 3.2.2
          EOF

      - id: versions
        uses: .
        with:
          working_directory: /tmp/myproject

      - name: Assert tools output contains golang
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          if ! echo "$TOOLS" | grep -q '"golang"'; then
            echo "FAIL: expected 'golang' key in tools JSON"
            exit 1
          fi
          echo "PASS: golang key found in tools JSON"

      - name: Assert tools output contains ruby
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          if ! echo "$TOOLS" | grep -q '"ruby"'; then
            echo "FAIL: expected 'ruby' key in tools JSON"
            exit 1
          fi
          echo "PASS: ruby key found in tools JSON"

      - name: Assert GOLANG_VERSION env var is exported
        run: |
          echo "GOLANG_VERSION=$GOLANG_VERSION"
          if [ -z "$GOLANG_VERSION" ]; then
            echo "FAIL: GOLANG_VERSION env var is not set"
            exit 1
          fi
          echo "PASS: GOLANG_VERSION=$GOLANG_VERSION"

      - name: Assert RUBY_VERSION env var is exported
        run: |
          echo "RUBY_VERSION=$RUBY_VERSION"
          if [ -z "$RUBY_VERSION" ]; then
            echo "FAIL: RUBY_VERSION env var is not set"
            exit 1
          fi
          echo "PASS: RUBY_VERSION=$RUBY_VERSION"
