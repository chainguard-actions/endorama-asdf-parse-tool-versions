name: Test basic usage - parse tool-versions output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action
        id: versions
        uses: .

      - name: Assert tools output is non-empty JSON
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          if [ -z "$TOOLS" ]; then
            echo "FAIL: tools output is empty"
            exit 1
          fi
          # Verify it is valid JSON
          echo "$TOOLS" | python3 -c "import sys, json; json.load(sys.stdin)" || {
            echo "FAIL: tools output is not valid JSON"
            exit 1
          }
          echo "PASS: tools output is valid JSON"

      - name: Assert nodejs version is present in output
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          NODEJS_VERSION=$(echo "$TOOLS" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('nodejs',''))")
          echo "nodejs version: $NODEJS_VERSION"
          if [ -z "$NODEJS_VERSION" ]; then
            echo "FAIL: nodejs key not found in tools output"
            exit 1
          fi
          echo "PASS: nodejs version found: $NODEJS_VERSION"
