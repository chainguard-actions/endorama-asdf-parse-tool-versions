name: Test basic usage - parse .tool-versions from root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: versions
        uses: .

      - name: Assert tools output is valid JSON
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          if [ -z "$TOOLS" ]; then
            echo "FAIL: tools output is empty"
            exit 1
          fi
          echo "$TOOLS" | python3 -c "import sys, json; json.load(sys.stdin)" || {
            echo "FAIL: tools output is not valid JSON"
            exit 1
          }
          echo "PASS: tools output is valid JSON"

      - name: Assert nodejs version is present in JSON output
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          NODEJS_VER=$(echo "$TOOLS" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('nodejs',''))")
          echo "nodejs version from JSON: $NODEJS_VER"
          if [ -z "$NODEJS_VER" ]; then
            echo "FAIL: nodejs key not found in tools JSON"
            exit 1
          fi
          echo "PASS: nodejs=$NODEJS_VER"

      - name: Assert NODEJS_VERSION env var is exported
        run: |
          echo "NODEJS_VERSION=$NODEJS_VERSION"
          if [ -z "$NODEJS_VERSION" ]; then
            echo "FAIL: NODEJS_VERSION env var is not set"
            exit 1
          fi
          echo "PASS: NODEJS_VERSION=$NODEJS_VERSION"
