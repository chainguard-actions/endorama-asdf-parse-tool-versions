name: Test basic usage - parse tool-versions from root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .tool-versions file in workspace root
        run: |
          echo "golang 1.21.0" > "$GITHUB_WORKSPACE/.tool-versions"
          echo "nodejs 20.11.1" >> "$GITHUB_WORKSPACE/.tool-versions"

      - id: versions
        uses: .
        with:
          working_directory: ${{ github.workspace }}

      - name: Assert tools output is valid JSON
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          if [ -z "$TOOLS" ]; then
            echo "FAIL: tools output is empty"
            exit 1
          fi
          echo "$TOOLS" | python3 -c "import sys, json; json.load(sys.stdin)" || {
            echo "FAIL: tools output is not valid JSON"
            exit 1
          }
          echo "PASS"

      - name: Assert golang version in output
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          GOLANG_VER=$(echo "$TOOLS" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('golang',''))")
          echo "golang version: $GOLANG_VER"
          if [ "$GOLANG_VER" != "1.21.0" ]; then
            echo "FAIL: expected golang version '1.21.0', got '$GOLANG_VER'"
            exit 1
          fi
          echo "PASS"

      - name: Assert nodejs version in output
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          NODEJS_VER=$(echo "$TOOLS" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('nodejs',''))")
          echo "nodejs version: $NODEJS_VER"
          if [ "$NODEJS_VER" != "20.11.1" ]; then
            echo "FAIL: expected nodejs version '20.11.1', got '$NODEJS_VER'"
            exit 1
          fi
          echo "PASS"

      - name: Assert GOLANG_VERSION env var is set
        run: |
          echo "GOLANG_VERSION: $GOLANG_VERSION"
          if [ "$GOLANG_VERSION" != "1.21.0" ]; then
            echo "FAIL: expected GOLANG_VERSION='1.21.0', got '$GOLANG_VERSION'"
            exit 1
          fi
          echo "PASS"

      - name: Assert NODEJS_VERSION env var is set
        run: |
          echo "NODEJS_VERSION: $NODEJS_VERSION"
          if [ "$NODEJS_VERSION" != "20.11.1" ]; then
            echo "FAIL: expected NODEJS_VERSION='20.11.1', got '$NODEJS_VERSION'"
            exit 1
          fi
          echo "PASS"
