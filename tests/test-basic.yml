name: Test basic usage - parse root .tool-versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: versions
        uses: .
        # No working_directory input — reads .tool-versions from the action root

      - name: Assert tools output is non-empty JSON
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          if [ -z "$TOOLS" ]; then
            echo "FAIL: tools output is empty"
            exit 1
          fi
          # Verify it is valid JSON (contains braces)
          if ! echo "$TOOLS" | grep -q '{'; then
            echo "FAIL: tools output does not look like JSON"
            exit 1
          fi
          echo "PASS: tools output is non-empty JSON"

      - name: Assert nodejs version is present in JSON
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          if ! echo "$TOOLS" | grep -q '"nodejs"'; then
            echo "FAIL: expected 'nodejs' key in tools JSON"
            exit 1
          fi
          echo "PASS: nodejs key found in tools JSON"

      - name: Assert NODEJS_VERSION env var is exported
        run: |
          echo "NODEJS_VERSION=$NODEJS_VERSION"
          if [ -z "$NODEJS_VERSION" ]; then
            echo "FAIL: NODEJS_VERSION env var is not set"
            exit 1
          fi
          echo "PASS: NODEJS_VERSION=$NODEJS_VERSION"
