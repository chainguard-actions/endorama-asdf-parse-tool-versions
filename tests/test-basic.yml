name: Test basic usage - single tool
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .tool-versions file
        run: |
          echo "golang 1.21.0" > "$GITHUB_WORKSPACE/.tool-versions"

      - id: versions
        uses: .

      - name: Assert tools JSON output
        env:
          ACTUAL: ${{ steps.versions.outputs.tools }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != '{"golang":"1.21.0"}' ]; then
            echo "FAIL: expected '{\"golang\":\"1.21.0\"}' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert GOLANG_VERSION env var
        run: |
          echo "GOLANG_VERSION=$GOLANG_VERSION"
          if [ "$GOLANG_VERSION" != "1.21.0" ]; then
            echo "FAIL: expected GOLANG_VERSION=1.21.0 but got '$GOLANG_VERSION'"
            exit 1
          fi
          echo "PASS"
