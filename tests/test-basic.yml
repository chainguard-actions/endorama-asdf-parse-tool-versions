name: Test basic usage - single tool
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .tool-versions file with a single tool
        run: |
          echo "nodejs 20.11.1" > .tool-versions

      - id: versions
        uses: .

      - name: Assert tools JSON output contains nodejs
        env:
          ACTUAL: ${{ steps.versions.outputs.tools }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: tools output is empty"
            exit 1
          fi
          # Check that the JSON contains nodejs key
          if ! echo "$ACTUAL" | grep -q '"nodejs"'; then
            echo "FAIL: expected 'nodejs' key in JSON output"
            exit 1
          fi
          # Check that the JSON contains the version value
          if ! echo "$ACTUAL" | grep -q '"20.11.1"'; then
            echo "FAIL: expected '20.11.1' version in JSON output"
            exit 1
          fi
          echo "PASS: tools output is $ACTUAL"

      - name: Assert NODEJS_VERSION env var is exported
        run: |
          echo "NODEJS_VERSION=$NODEJS_VERSION"
          if [ "$NODEJS_VERSION" != "20.11.1" ]; then
            echo "FAIL: expected NODEJS_VERSION=20.11.1 but got '$NODEJS_VERSION'"
            exit 1
          fi
          echo "PASS"
