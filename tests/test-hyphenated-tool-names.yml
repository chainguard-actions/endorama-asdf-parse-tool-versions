name: Test hyphenated tool names are normalized
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .tool-versions file with hyphenated tool name
        run: |
          echo "golangci-lint 1.54.0" > "$GITHUB_WORKSPACE/.tool-versions"

      - id: versions
        uses: .
        with:
          working_directory: ${{ github.workspace }}

      - name: Assert tools output contains golangci-lint key
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          echo "tools output: $TOOLS"
          # The action replaces hyphens with underscores in JSON keys
          LINT_VER=$(echo "$TOOLS" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('golangci_lint', d.get('golangci-lint','')))")
          echo "golangci-lint version: $LINT_VER"
          if [ "$LINT_VER" != "1.54.0" ]; then
            echo "FAIL: expected golangci-lint version '1.54.0', got '$LINT_VER'"
            exit 1
          fi
          echo "PASS"

      - name: Assert GOLANGCI_LINT_VERSION env var is set
        run: |
          echo "GOLANGCI_LINT_VERSION: $GOLANGCI_LINT_VERSION"
          if [ "$GOLANGCI_LINT_VERSION" != "1.54.0" ]; then
            echo "FAIL: expected GOLANGCI_LINT_VERSION='1.54.0', got '$GOLANGCI_LINT_VERSION'"
            exit 1
          fi
          echo "PASS"
